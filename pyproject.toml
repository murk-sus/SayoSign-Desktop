[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sayosign-desktop"
version = "0.2.2"
description = "Sign and install IPA files on your iPhone from Linux, Windows or macOS"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10"
dependencies = ["aiohttp>=3.9", "cryptography>=42", "pymobiledevice3>=4", "pywebview>=5", "qrcode>=7"]

[project.urls]
Homepage = "https://github.com/murk-sus/SayoSign-Desktop"
"iOS app" = "https://github.com/murk-sus/SayoSign"

[project.scripts]
sayosign-desktop = "sayosign_desktop.__main__:main"

[tool.setuptools.packages.find]
include = ["sayosign_desktop*"]

[tool.setuptools.package-data]
sayosign_desktop = ["web/*", "web/lens/*", "bin/*", "apple_root.pem"]
